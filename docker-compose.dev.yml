# Development infrastructure: Postgres (source of truth) and Redis (BullMQ queues).
# The apps run on the host (`yarn dev`).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge
      POSTGRES_DB: nudge
    ports:
      - '${NUDGE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - nudge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudge -d nudge']
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - '${NUDGE_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  nudge_postgres:
