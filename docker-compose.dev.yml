# Development infrastructure: Postgres (source of truth), Redis (BullMQ queues) and
# Mailpit (an SMTP server that keeps every email, for the email Destinations).
# The apps run on the host (`yarn dev`). The ports listen on 127.0.0.1 only: the
# password is `nudge` and Redis has none.
services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge
      POSTGRES_DB: nudge
    ports:
      - '127.0.0.1:${NUDGE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - nudge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudge -d nudge']
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    ports:
      - '127.0.0.1:${NUDGE_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
  # SMTP on 127.0.0.1:1025 (Settings › Email: host 127.0.0.1, port 1025, security
  # None); the emails are read at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - '127.0.0.1:${NUDGE_MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${NUDGE_MAILPIT_UI_PORT:-8025}:8025'

volumes:
  nudge_postgres:
