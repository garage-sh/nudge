# Infrastructure de développement : Postgres (source de vérité) et Redis (queues BullMQ).
# Les apps tournent sur le poste (`yarn workspace @nudge/api dev`, etc.).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge
      POSTGRES_DB: nudge
    ports:
      - '${NUDGE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - nudge_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '${NUDGE_REDIS_PORT:-6379}:6379'

volumes:
  nudge_postgres:
