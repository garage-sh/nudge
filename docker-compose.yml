# A complete nudge Instance: `docker compose up -d`, then http://localhost:8080.
# The configuration is read from `.env` (copy `.env.example`); see the README.
#
# Only the dashboard publishes a port: it also serves the api (/api, /v1) and the Widget
# (/widget/nudge-widget.js) on the same origin. Put a TLS reverse proxy in front of it.
# The port listens on 127.0.0.1 only (NUDGE_BIND): a client must not reach it without
# going through that proxy, or it could choose its IP (see the README).
#
# The nudge images come from ghcr.io; NUDGE_VERSION pins them (default: latest, pin an
# exact version in production). Postgres and Redis are pinned by digest; Dependabot
# proposes the new one.
# Build from source: add `-f docker-compose.build.yml`. Replicate the worker
# separately: add `-f docker-compose.worker.yml` (see the README).

x-nudge-env: &nudge-env
  DATABASE_URL: postgres://nudge:${NUDGE_POSTGRES_PASSWORD:?set NUDGE_POSTGRES_PASSWORD in .env}@postgres:5432/nudge
  REDIS_URL: redis://redis:6379
  NUDGE_ENCRYPTION_KEY: ${NUDGE_ENCRYPTION_KEY:?set NUDGE_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  NUDGE_DASHBOARD_URL: ${NUDGE_DASHBOARD_URL:-}
  NUDGE_COOKIE_SECURE: ${NUDGE_COOKIE_SECURE:-true}
  # The dashboard's proxy, plus those placed in front of it (see the README).
  NUDGE_TRUST_PROXY: ${NUDGE_TRUST_PROXY:-1}
  NUDGE_ROLES: ${NUDGE_ROLES:-}
  NUDGE_WIDGET_RATE_LIMIT_IP: ${NUDGE_WIDGET_RATE_LIMIT_IP:-}
  NUDGE_WIDGET_RATE_LIMIT_PROJECT: ${NUDGE_WIDGET_RATE_LIMIT_PROJECT:-}
  NUDGE_JUDGE_PROVIDER: ${NUDGE_JUDGE_PROVIDER:-}
  NUDGE_JUDGE_API_KEY: ${NUDGE_JUDGE_API_KEY:-}
  NUDGE_JUDGE_MODEL: ${NUDGE_JUDGE_MODEL:-}
  NUDGE_JUDGE_BASE_URL: ${NUDGE_JUDGE_BASE_URL:-}
  NUDGE_JUDGE_TIMEOUT_MS: ${NUDGE_JUDGE_TIMEOUT_MS:-}
  NUDGE_TRIAGE_JUNK_THRESHOLD: ${NUDGE_TRIAGE_JUNK_THRESHOLD:-}
  NUDGE_TRIAGE_MANIPULATION_THRESHOLD: ${NUDGE_TRIAGE_MANIPULATION_THRESHOLD:-}
  NUDGE_TRIAGE_CONFIDENCE_THRESHOLD: ${NUDGE_TRIAGE_CONFIDENCE_THRESHOLD:-}
  NUDGE_SUSPENSION_FAILURE_THRESHOLD: ${NUDGE_SUSPENSION_FAILURE_THRESHOLD:-}
  NUDGE_SUSPENSION_COOLDOWN_MS: ${NUDGE_SUSPENSION_COOLDOWN_MS:-}
  NUDGE_SUSPENSION_PROBE_INTERVAL_MS: ${NUDGE_SUSPENSION_PROBE_INTERVAL_MS:-}
  NUDGE_PURGE_INTERVAL_MS: ${NUDGE_PURGE_INTERVAL_MS:-}
  NUDGE_CAPTURES_STORAGE: ${NUDGE_CAPTURES_STORAGE:-disk}
  # The `captures` volume, mounted at the same place in the api and the worker.
  NUDGE_CAPTURES_DIR: /var/lib/nudge/captures
  NUDGE_S3_ENDPOINT: ${NUDGE_S3_ENDPOINT:-}
  NUDGE_S3_REGION: ${NUDGE_S3_REGION:-}
  NUDGE_S3_BUCKET: ${NUDGE_S3_BUCKET:-}
  NUDGE_S3_ACCESS_KEY_ID: ${NUDGE_S3_ACCESS_KEY_ID:-}
  NUDGE_S3_SECRET_ACCESS_KEY: ${NUDGE_S3_SECRET_ACCESS_KEY:-}
  NUDGE_S3_PREFIX: ${NUDGE_S3_PREFIX:-}
  NUDGE_S3_FORCE_PATH_STYLE: ${NUDGE_S3_FORCE_PATH_STYLE:-}

services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: ${NUDGE_POSTGRES_PASSWORD:?set NUDGE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nudge
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudge -d nudge']
      interval: 5s
      timeout: 3s
      retries: 10

  # The BullMQ queues: persisted (AOF), and never evicted under memory pressure.
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the database migrations, then stops; the api and the worker wait for it.
  migrate:
    image: ghcr.io/garage-sh/nudge:${NUDGE_VERSION:-latest}
    command: ['node', 'apps/api/dist/migrate.js']
    environment:
      DATABASE_URL: postgres://nudge:${NUDGE_POSTGRES_PASSWORD}@postgres:5432/nudge
    depends_on:
      postgres:
        condition: service_healthy

  # The api and the worker in the same process (NUDGE_ROLES, default: api,worker).
  nudge:
    image: ghcr.io/garage-sh/nudge:${NUDGE_VERSION:-latest}
    restart: unless-stopped
    environment: *nudge-env
    volumes:
      - captures:/var/lib/nudge/captures
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    image: ghcr.io/garage-sh/nudge-dashboard:${NUDGE_VERSION:-latest}
    restart: unless-stopped
    # 127.0.0.1: reachable from the host's TLS proxy, not from the network.
    ports:
      - '${NUDGE_BIND:-127.0.0.1}:${NUDGE_PORT:-8080}:8080'
    depends_on:
      nudge:
        condition: service_healthy

volumes:
  postgres:
  redis:
  captures:
