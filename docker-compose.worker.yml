# The worker in its own containers, to replicate it without replicating the api:
#
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d --scale worker=3
#
# The `nudge` service then only serves the api; Triage and Dispatch move to the
# `worker` service, the same image started with NUDGE_ROLES=worker.

services:
  nudge:
    environment:
      NUDGE_ROLES: api
  worker:
    extends:
      file: docker-compose.yml
      service: nudge
    environment:
      NUDGE_ROLES: worker
