name: Bug
description: nudge does not behave as expected.
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately, not here (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag (`docker compose images`) or the commit.
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - docker compose, a single nudge process
        - docker compose, separate worker (docker-compose.worker.yml)
        - Other (Kubernetes, from source…)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Project…
        2. Send a Feedback…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected, and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: '`docker compose logs nudge`, without any key or token.'
      render: shell
