name: Idée ou demande
description: Proposer une fonctionnalité ou un changement de comportement.
labels: [needs-triage]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Le problème
      description: Ce que vous essayez de faire, et ce qui vous en empêche aujourd'hui.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Ce que vous proposez
  - type: textarea
    id: alternatives
    attributes:
      label: Ce que vous faites en attendant
