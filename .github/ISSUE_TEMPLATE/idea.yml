name: Idea or request
description: Propose a feature or a behavior change.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what prevents you from doing it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: textarea
    id: alternatives
    attributes:
      label: What you do in the meantime
