# Mises à jour groupées, une fois par semaine. Les images de base du Dockerfile sont
# épinglées par digest : Dependabot propose aussi le nouveau digest d'un même tag, ce
# qui reconstruit les images de nudge avec les correctifs d'Alpine et de Node.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      developpement:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directories: [/]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
