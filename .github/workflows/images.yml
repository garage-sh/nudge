# Les images de nudge sur ghcr.io : `nudge` (api et worker) et `nudge-dashboard`.
#
# - PR : construites sans être poussées, pour vérifier le Dockerfile.
# - main : poussées sous `edge` et `sha-<commit>`.
# - tag vX.Y.Z : poussées sous X.Y.Z, X.Y, X (à partir de 1.0) et latest, puis la
#   GitHub Release est créée avec ses notes, le compose et `env.example`.
#
# Chaque architecture (amd64, arm64) se construit sur un runner natif, sans émulation ;
# les deux sont réunies sous un même tag. Chaque image publiée porte un SBOM et une
# attestation de provenance, est signée par cosign (sans clé, via l'OIDC de GitHub) et
# scannée : une vulnérabilité critique corrigée en amont fait échouer la publication.
name: Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  construire:
    name: ${{ matrix.image.nom }} (${{ matrix.plateforme.arch }})
    runs-on: ${{ matrix.plateforme.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { nom: nudge, cible: server }
          - { nom: nudge-dashboard, cible: dashboard }
        plateforme:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.nom }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image.cible }}
          platforms: linux/${{ matrix.plateforme.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.cible }}-${{ matrix.plateforme.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.cible }}-${{ matrix.plateforme.arch }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # Poussée par digest seulement : les tags sont posés une fois les deux
          # architectures réunies (job `publier`).
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, github.repository_owner, matrix.image.nom) || 'type=cacheonly' }}
      - if: github.event_name != 'pull_request'
        name: Digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.nom }}-${{ matrix.plateforme.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publier:
    name: Publier ${{ matrix.nom }}
    if: github.event_name != 'pull_request'
    needs: construire
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # signature cosign sans clé
    strategy:
      fail-fast: false
      matrix:
        nom: [nudge, nudge-dashboard]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.nom }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.nom }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,prefix=sha-
      - name: Réunir les architectures sous les tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Découpage voulu : une option `-t` par tag, un argument par digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: digest
        name: Digest de l'index
        run: |
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signer
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
      - name: Scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Le compose et la configuration d'exemple sont joints à la release : le README
      # les télécharge depuis releases/latest, sans cloner le dépôt.
      - name: Créer la release, ses notes et ses fichiers
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          cp .env.example env.example
          gh release create "$TAG" --verify-tag --generate-notes $prerelease \
            docker-compose.yml docker-compose.worker.yml env.example
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
