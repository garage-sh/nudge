# Checks every PR and every push to main: format, lint, types, build, tests (including
# the pipeline tests, on Postgres and Redis in containers), the absence of secrets, and
# the absence of dependencies with a high or critical advisory.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, lint, types, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Yarn 4 comes from the repository (`yarnPath`): a `yarn` that runs it is enough.
      - name: Repository Yarn
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s"/.yarn/releases/yarn-*.cjs "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/yarn"
          chmod +x "$RUNNER_TEMP/bin/yarn"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn prettier --check .
      - run: yarn lint
      - run: yarn check-types
      - run: yarn build
      - run: yarn test

  secrets:
    name: Secrets in the history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Known false positives: .gitleaksignore. The image is pinned by digest, like the
      # actions: Dependabot does not update it, raise tag and digest together.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --redact --verbose

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository Yarn
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s"/.yarn/releases/yarn-*.cjs "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/yarn"
          chmod +x "$RUNNER_TEMP/bin/yarn"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Every workspace and transitive dependency of yarn.lock against the npm advisory
      # database, without installing. High and critical fail the build; moderate and low
      # ones are left to Dependabot (today: dev servers of build tools only).
      - run: yarn npm audit --all --recursive --no-deprecations --severity high
